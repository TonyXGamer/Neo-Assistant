<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ai-dashboard">
        <div class="time-panel">
            <p id="clock">8:00pm</p>
            <p id="date">Friday, November 6, 2026</p>
        </div>
        <div class="weather-panel">
            <p id="weather-temp">Temperature: Loading...</p>
            <p id="weather-condition">Conditions: Loading...</p>
            <div id="forecast-container"></div>
        </div>
        <div class="neo-core">
            <div class="hud-ticks"></div>
            <div class="hud-ring"></div>
            <h1>NEO</h1>
            <p>AI Assistant Online</p>
        </div>
        <div class="task-panel">
            <h2>Tasks</h2>
            <p>No tasks</p>
        </div>
        <div class="system-panel">
            <h2>System</h2>
            <p id="neo-status">NEO: ONLINE</p>
            <p id="network-status">Network: Checking...</p>
            <p id="battery-status">Battery: Checking...</p>
            <p id="cpu-status">CPU: Checking...</p>
            <div class="usage-bar">
                <div class="usage-fill" id="cpu-fill"></div>
            </div>
            <p id="ram-status">RAM: Checking...</p>
            <div class="usage-bar">
                <div class="usage-fill" id="ram-fill"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
